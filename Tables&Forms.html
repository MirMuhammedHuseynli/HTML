<!DOCTYPE html>
<html lang="en">
<head ="container_mir100kf">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and Forms</title>
</head>
<body>
    <table border="1">
        <thead>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>Smith</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
    <form action="index.html">
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" placeholder="First Name">
        <br>
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" placeholder="Last Name">
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Age">
        <br>
        <input type="submit" value="Submit">
    </form>
    <br><br><br>
    <form action="list.html">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email">
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password">
        <br>
        <input type="submit" value="LOGIN">
    </form>
    <br><br><br>
    <p>Poor or Rich?</p>
    <form action="Image.html">
        <label for="poor">Poor</label>
        <input type="radio" id="poor" name="status" value="poor">
        <br>
        <label for="rich">Rich</label>
        <input type="radio" id="rich" name="status" value="rich">
        <br>
        <input type="submit" value="Choose">
    </form>
    <br>
    <form action="div&span.html">
        <select>
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
        <input type="submit" value="Choose">
</body>
</html>
